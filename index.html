<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2e7">
<title>Memory Garden</title>
<link rel="stylesheet" href="diary-fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<aside class="sidebar">
  <a class="brand" href="#today" data-nav="today"><span class="brand-flower" aria-hidden="true">✿</span><span><b data-i18n="brand"></b><small data-i18n="brandLine"></small></span></a>
  <p class="nav-eyebrow" data-i18n="menu"></p>
  <nav data-i18n-aria="menu"><button data-nav="today" class="nav-button active"><span aria-hidden="true">☀</span><span data-i18n="today"></span></button><button data-nav="year" class="nav-button"><span aria-hidden="true">▦</span><span data-i18n="year"></span></button><button data-nav="diary" class="nav-button"><span aria-hidden="true">✎</span><span data-i18n="diary"></span></button><button data-nav="focus" class="nav-button"><span aria-hidden="true">◷</span><span data-i18n="focus"></span></button><button data-nav="memories" class="nav-button"><span aria-hidden="true">♡</span><span data-i18n="memories"></span></button></nav>
  <div class="sidebar-foot"><img src="assets/moss.png" alt="" class="sidebar-friend"><p data-i18n="sideNote"></p><button class="nav-button settings-button" id="settingsButton"><span aria-hidden="true">⚙</span><span data-i18n="settings"></span></button><small><span class="saved-dot"></span><span data-i18n="savedDevice"></span></small></div>
</aside>
<div class="app-body">
  <header class="topbar"><span id="headerDate"></span><div class="top-actions"><button class="round-button" id="notificationButton" data-i18n-title="reminders" data-i18n-aria="reminders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><div class="language-toggle" role="group" data-i18n-aria="language"><button data-language="en" lang="en">EN</button><button data-language="th" lang="th">ไทย</button></div></div></header>
  <main id="main">
    <section class="view active" id="view-today" aria-labelledby="todayTitle">
      <div class="page-heading"><div><h1 id="todayTitle" data-i18n="greeting"></h1><p data-i18n="greetingSub"></p></div><button class="button primary" data-new-task><span aria-hidden="true">＋</span><span data-i18n="addTask"></span></button></div>
      <section class="welcome-card">
        <div class="welcome-copy"><span class="eyebrow"><span class="mini-flower" aria-hidden="true">✿</span><span data-i18n="heroEyebrow"></span></span><h2 data-i18n="heroTitle"></h2><p data-i18n="heroBody"></p><button class="button butter" data-nav="diary"><span aria-hidden="true">✎</span><span data-i18n="openDiary"></span><span aria-hidden="true">↗</span></button></div>
        <div class="welcome-art"><img src="assets/cottage.png" data-i18n-alt="altCottage"><span class="art-sticker" data-i18n="artSticker"></span><span class="art-sparkle" aria-hidden="true">✧</span></div>
      </section>
      <div class="garden-stats"><span><i class="stat-icon sage" aria-hidden="true">✓</i><b id="statTasks">0</b><span data-i18n="tasksStat"></span></span><span><i class="stat-icon butter-bg" aria-hidden="true">✦</i><b id="statXP">0</b><span data-i18n="xpStat"></span></span><span><i class="stat-icon rose-bg" aria-hidden="true">♡</i><b id="statPages">0</b><span data-i18n="pagesStat"></span></span></div>
      <div class="home-grid">
        <article class="panel task-panel"><div class="section-title"><div><span class="eyebrow" data-i18n="yourDay"></span><h2 data-i18n="taskHeading"></h2></div><span class="tiny-flower" aria-hidden="true">❀</span></div><div class="day-progress"><div class="track"><span id="taskProgress"></span></div><span id="taskCount"></span></div><div id="taskList"></div><button class="button dashed" data-new-task><span aria-hidden="true">＋</span><span data-i18n="addSmall"></span></button></article>
        <article class="panel pet-panel"><span class="eyebrow" data-i18n="yourFriend"></span><div class="pet-title-row"><h2 id="petName"></h2><span class="level-pill" id="petLevel"></span></div><div class="pet-stage"><span class="pet-sun" aria-hidden="true">☀</span><button id="petHello" class="pet-image-button" data-i18n-aria="sayHello"><img id="petImage" src="assets/moss.png" data-i18n-alt="altPet"></button><span class="pet-daisy" aria-hidden="true">✿</span><div class="pet-speech" id="petSpeech" role="status"></div></div><p class="pet-mood" data-i18n="petMood"></p><div class="xp-row"><div class="track"><span id="xpProgress"></span></div><small id="xpText"></small></div><p id="nextFriend" class="next-friend"></p><button class="button soft wide" id="friendsButton"><span aria-hidden="true">♡</span><span data-i18n="friends"></span></button></article>
      </div>
      <div class="today-studio-grid"><article class="panel today-diary-panel"><span class="eyebrow" data-i18n="latestDiary"></span><h2 data-i18n="latestDiaryTitle"></h2><div id="todayDiaryList"></div></article><article class="panel today-focus-card"><span class="eyebrow" data-i18n="focusRankLabel"></span><h2 data-i18n="focusQuickTitle"></h2><p data-i18n="focusQuickBody"></p><span class="level-pill" id="todayFocusRank"></span><button class="button butter" data-nav="focus"><span>◷</span><span data-i18n="focusOpen"></span></button></article></div>
      <div class="lower-grid"><article class="journal-postcard"><img src="assets/journal-window.png" data-i18n-alt="altJournal"><div><span class="eyebrow" data-i18n="photoTeaser"></span><h2 data-i18n="diaryTeaserTitle"></h2><p data-i18n="diaryTeaserBody"></p><button class="text-button" data-nav="diary"><span data-i18n="openDiary"></span><span aria-hidden="true">↗</span></button></div></article><article class="panel upcoming-panel"><span class="eyebrow" data-i18n="comingUp"></span><h2 data-i18n="upcomingHeading"></h2><div id="upcomingList"></div><button class="text-button" data-nav="year"><span data-i18n="seeCalendar"></span><span aria-hidden="true">↗</span></button></article></div>
    </section>
    <section class="view" id="view-year" aria-labelledby="yearTitle">
      <div class="page-heading"><div><span class="eyebrow" data-i18n="yearEyebrow"></span><h1 id="yearTitle" data-i18n="yearTitle"></h1><p data-i18n="yearSub"></p></div><button class="button primary" data-new-task><span>＋</span><span data-i18n="addTask"></span></button></div>
      <div class="calendar-layout"><article class="panel calendar-panel"><div class="calendar-toolbar"><h2 id="calendarTitle"></h2><div><button class="round-button" id="previousMonth" data-i18n-aria="prevMonth">←</button><button class="round-button" id="nextMonth" data-i18n-aria="nextMonth">→</button></div></div><div class="calendar-tools"><label><span data-i18n="monthJump"></span><input id="calendarJump" type="month"></label><button class="button soft" id="backToday" data-i18n="backToday"></button></div><div class="calendar-grid" id="calendarGrid"></div></article><aside class="panel agenda-panel"><span class="eyebrow" data-i18n="selectedDay"></span><h2 id="agendaDate"></h2><div id="agendaList"></div><button class="button dashed" id="addSelected"><span>＋</span><span data-i18n="addSelected"></span></button><img src="assets/cottage.png" class="agenda-art" data-i18n-alt="altCottage"></aside></div><div class="birthday-note"><span aria-hidden="true">🎂</span><div><b data-i18n="birthdayNote"></b><p data-i18n="birthdayNoteBody"></p></div></div>
    </section>
    <section class="view" id="view-diary" aria-labelledby="diaryTitle">
      <div class="page-heading"><div><span class="eyebrow" data-i18n="diaryEyebrow"></span><h1 id="diaryTitle" data-i18n="diaryTitle"></h1><p data-i18n="diarySub"></p></div><div class="diary-heading-actions"><label class="date-label"><span data-i18n="diaryDate"></span><input id="diaryDate" type="date"></label><button class="button primary" id="saveDiaryTop"><span>♡</span><span data-i18n="savePage"></span></button></div></div>
      <div class="diary-layout"><article class="panel diary-paper" id="diaryPaper" data-paper="ruled"><div class="diary-style-toolbar"><label><span data-i18n="diaryFont"></span><select id="diaryFont"></select></label><label class="ink-picker"><span data-i18n="diaryColour"></span><input id="diaryColour" type="color" value="#718165"></label><label><span data-i18n="diaryPaper"></span><select id="diaryPaperType"><option value="ruled" data-i18n="paperRuled"></option><option value="plain" data-i18n="paperPlain"></option><option value="dots" data-i18n="paperDots"></option><option value="grid" data-i18n="paperGrid"></option><option value="kraft" data-i18n="paperKraft"></option><option value="rose" data-i18n="paperRose"></option></select></label><small class="font-note" data-i18n="fontHint"></small></div><div class="paper-heading"><span aria-hidden="true">✿</span><span id="diaryDateLabel"></span></div><textarea id="diaryEntry" data-i18n-placeholder="entryPlaceholder"></textarea><div id="photoPreview" class="photo-preview"></div><div class="diary-actions"><label class="button soft file-label"><span aria-hidden="true">▧</span><span data-i18n="addPhotos"></span><input id="photoInput" type="file" multiple accept="image/*"></label><small id="saveStatus" role="status"></small><button class="button primary" id="saveDiary"><span>♡</span><span data-i18n="savePage"></span></button></div></article><article class="diary-side"><figure class="diary-cover"><img id="diarySideImage" src="assets/journal-window.png" data-i18n-alt="altJournal"><figcaption><label class="button soft file-label"><span>▧</span><span data-i18n="changeCover"></span><input id="diaryCoverInput" type="file" accept="image/*"></label><button class="text-button" id="restoreDiaryCover" data-i18n="restoreCover"></button></figcaption></figure><div class="prompt-card"><span class="eyebrow" data-i18n="promptLabel"></span><h2 id="promptText"></h2><button class="text-button" id="nextPrompt"><span data-i18n="anotherPrompt"></span><span>↻</span></button></div><p class="privacy-note" data-i18n="diaryPrivacy"></p></article></div>
    </section>
    
    <section class="view" id="view-focus" aria-labelledby="focusViewTitle">
      <div class="page-heading"><div><span class="eyebrow" data-i18n="focusEyebrow"></span><h1 id="focusViewTitle" data-i18n="focusTitle"></h1><p data-i18n="focusSub"></p></div></div>
      <div class="focus-layout"><article class="panel focus-form-panel"><span class="eyebrow" data-i18n="focusEyebrow"></span><form id="focusForm"><label><span data-i18n="focusTask"></span><input id="focusTaskName" required maxlength="100" data-i18n-placeholder="focusPlaceholder"></label><label><span data-i18n="focusDuration"></span><select id="focusDuration"><option value="15" data-i18n="duration15"></option><option value="25" data-i18n="duration25"></option><option value="30" selected data-i18n="duration30"></option><option value="45" data-i18n="duration45"></option><option value="60" data-i18n="duration60"></option><option value="90" data-i18n="duration90"></option><option value="custom" data-i18n="durationCustom"></option></select></label><label id="focusCustomLabel" hidden><span data-i18n="focusCustomMinutes"></span><input id="focusCustomMinutes" type="number" min="5" max="180" step="1" value="30"></label><p id="focusReward" class="focus-reward"></p><button class="button primary wide" id="startFocus" data-i18n="focusStart"></button></form><p class="privacy-note" data-i18n="focusTimerNote"></p></article>
      <article class="panel focus-clock-panel"><span class="eyebrow" id="focusTaskDisplay"></span><div class="focus-clock" id="focusClock"><span id="focusTime" role="timer" aria-live="off">30:00</span><span id="focusStatus"></span></div><div class="focus-controls"><button class="button primary" id="toggleFocus" data-i18n="focusPause" hidden></button><button class="button soft" id="minimiseFocus" data-i18n="focusMinimise" hidden></button><button class="text-button danger" id="cancelFocus" data-i18n="focusCancel" hidden></button></div></article></div>
      <div class="focus-bottom-grid"><article class="panel focus-rank-card"><span class="eyebrow" data-i18n="focusRankLabel"></span><div class="rank-badge" aria-hidden="true">✿</div><h2 id="focusRankName"></h2><p id="focusRankStats"></p><div class="track"><span id="focusRankProgress"></span></div><small id="focusRankNext"></small></article><article class="panel focus-history-card"><h2 data-i18n="focusHistory"></h2><div id="focusHistoryList"></div></article></div>
      <article class="panel music-panel"><div class="section-title"><div><span class="eyebrow" data-i18n="musicEyebrow"></span><h2 data-i18n="musicTitle"></h2></div><span class="tiny-flower" aria-hidden="true">♫</span></div><p class="music-intro" data-i18n="musicIntro"></p><div class="playlist-toolbar"><label><span data-i18n="playlistLabel"></span><select id="musicPlaylist"></select></label><button class="button primary" id="playPlaylist"><span>▶</span><span data-i18n="playPlaylist"></span></button><button class="text-button danger" id="deletePlaylist" data-i18n="deletePlaylist"></button></div><form id="playlistForm" class="playlist-create"><label><span data-i18n="playlistName"></span><input id="playlistName" maxlength="60" required data-i18n-placeholder="playlistNamePlaceholder"></label><button class="button soft" data-i18n="createPlaylist"></button></form><form id="trackForm" class="music-add-form"><label><span data-i18n="videoLink"></span><input id="musicVideoUrl" required type="text" placeholder="https://www.youtube.com/watch?v=…" maxlength="500"></label><label><span data-i18n="trackTitle"></span><input id="musicTrackName" maxlength="100" data-i18n-placeholder="trackTitlePlaceholder"></label><button class="button butter" data-i18n="addTrack"></button></form><div id="musicTrackList"></div><div class="music-links"><a class="text-button" href="https://www.youtube.com/results?search_query=lofi+study+music" target="_blank" rel="noopener noreferrer" data-i18n="findYouTube"></a></div><p class="privacy-note" data-i18n="musicNote"></p><p class="privacy-note" data-i18n="musicQueueHint"></p></article>
    </section>

    <section class="view" id="view-memories" aria-labelledby="memoryTitle">
      <div class="page-heading"><div><span class="eyebrow" data-i18n="memoryEyebrow"></span><h1 id="memoryTitle" data-i18n="memoryTitle"></h1><p data-i18n="memorySub"></p></div></div>
      <div class="memory-banner"><div><span class="eyebrow" data-i18n="summaryLabel"></span><h2 data-i18n="summaryBanner"></h2><p data-i18n="summaryBannerBody"></p><div class="summary-actions"><label><span data-i18n="summaryMonth"></span><input id="summaryMonth" type="month"></label><button class="button primary" id="makeSummary"><span>✧</span><span data-i18n="createSummary"></span></button></div></div><img src="assets/journal-window.png" data-i18n-alt="altJournal"></div>
      <div class="filter-row"><button class="filter-chip active" data-filter="all" data-i18n="filterAll"></button><button class="filter-chip" data-filter="summary" data-i18n="filterSummary"></button><button class="filter-chip" data-filter="diary" data-i18n="filterDiary"></button></div><div class="memory-grid" id="memoryGrid"></div>
    </section>
    <footer class="main-footer"><span aria-hidden="true">✿</span><span data-i18n="footer"></span></footer>
  </main>
</div>
<div class="activity-dock"><aside id="focusDock" class="focus-dock" hidden><div><span class="eyebrow" id="focusDockTitle"></span><b id="focusDockTime" role="timer" aria-live="off"></b><small id="focusDockStatus"></small></div><div class="focus-dock-actions"><button class="round-button" id="focusDockToggle" data-i18n-aria="focusPause">Ⅱ</button><button class="round-button" id="openFocusDock" data-i18n-aria="focusOpen">↗</button><button class="round-button" id="dismissFocusDock" data-i18n-aria="focusDismiss">×</button></div></aside><aside id="musicPlayerDock" class="music-player-dock" hidden><div class="music-player-heading"><b id="musicPlayerLabel"></b><button class="round-button" id="stopMusic" data-i18n-aria="stopMusic">×</button></div><iframe id="youtubePlayer" src="about:blank" width="340" height="200" data-i18n-title="musicPlayerTitle" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><a class="text-button" id="youtubeFallback" target="_blank" rel="noopener noreferrer" data-i18n="openYouTube"></a></aside></div>
<button class="floating-friend" id="floatingFriend" data-i18n-title="sayHello" data-i18n-aria="sayHello"><img src="assets/moss.png" alt=""><span aria-hidden="true">♡</span></button>
<dialog id="taskDialog" class="dialog"><form id="taskForm"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="heroEyebrow"></span><h2 id="taskDialogTitle"></h2></div><button type="button" class="round-button" data-close="taskDialog" data-i18n-aria="close">×</button></div><input id="editTaskId" type="hidden"><label><span data-i18n="taskName"></span><input id="taskName" required maxlength="100" data-i18n-placeholder="taskPlaceholder"></label><div class="form-row"><label><span data-i18n="date"></span><input id="taskDate" type="date" required></label><label><span data-i18n="time"></span><input id="taskTime" type="time"></label></div><div class="form-row"><label><span data-i18n="category"></span><select id="taskCategory"><option value="task" data-i18n="categoryTask"></option><option value="health" data-i18n="categoryHealth"></option><option value="workout" data-i18n="categoryWorkout"></option><option value="birthday" data-i18n="categoryBirthday"></option><option value="moment" data-i18n="categoryMoment"></option></select></label><label><span data-i18n="repeat"></span><select id="taskRepeat"><option value="none" data-i18n="repeatNone"></option><option value="daily" data-i18n="repeatDaily"></option><option value="weekly" data-i18n="repeatWeekly"></option><option value="yearly" data-i18n="repeatYearly"></option></select></label></div><label class="check-label"><input type="checkbox" id="taskRemind" checked><span data-i18n="remindTask"></span></label><p class="hint" data-i18n="reminderHint"></p><div class="dialog-actions"><button type="button" class="text-button danger" id="deleteTask" data-i18n="deleteTask"></button><button type="button" class="button soft" data-close="taskDialog" data-i18n="cancel"></button><button class="button primary" id="submitTask" data-i18n="saveTask"></button></div></form></dialog>
<dialog id="settingsDialog" class="dialog"><div class="dialog-heading"><div><h2 data-i18n="settingsTitle"></h2><p data-i18n="settingsIntro"></p></div><button class="round-button" data-close="settingsDialog" data-i18n-aria="close">×</button></div><section class="setting-section"><h3 data-i18n="language"></h3><div class="language-toggle"><button data-language="en" lang="en">English</button><button data-language="th" lang="th">ไทย</button></div></section><section class="setting-section"><h3 data-i18n="notificationsTitle"></h3><p data-i18n="notificationsBody"></p><p class="hint" id="notificationStatus"></p><button class="button soft" id="enableNotifications" data-i18n="enable"></button></section><section class="setting-section"><h3 data-i18n="backup"></h3><p data-i18n="backupBody"></p><div class="backup-buttons"><button class="button soft" id="exportGarden" data-i18n="export"></button><label class="button soft file-label"><span data-i18n="import"></span><input id="importGarden" type="file" accept="application/json,.json"></label></div></section><section class="setting-section"><h3 data-i18n="reset"></h3><p data-i18n="resetBody"></p><button class="text-button danger" id="resetGarden" data-i18n="reset"></button></section></dialog>
<dialog id="friendsDialog" class="dialog"><div class="dialog-heading"><h2 data-i18n="friends"></h2><button class="round-button" data-close="friendsDialog" data-i18n-aria="close">×</button></div><div id="friendCollection" class="friend-collection"></div></dialog>
<dialog id="memoryDialog" class="dialog memory-dialog"><div class="dialog-heading"><span class="eyebrow" id="memoryType"></span><button class="round-button" data-close="memoryDialog" data-i18n-aria="close">×</button></div><div id="memoryDetail"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div id="celebration" aria-hidden="true"></div>
<script src="i18n.js"></script><script src="garden-core.js"></script><script src="app.js"></script>
</body></html>
